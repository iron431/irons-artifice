name: Build

on:
  push:
    branches: [ 'arena/*', 'main' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: irons_artifice-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Verify jar contains valid neoforge.mods.toml
        if: success()
        run: |
          echo "=== Checking generated neoforge.mods.toml ==="
          cat build/generated/sources/modMetadata/META-INF/neoforge.mods.toml || echo "not found"
          echo "=== Checking jar contents ==="
          jar tf build/libs/*.jar | grep -E "neoforge.mods.toml|irons_artifice" | head -n 50
          echo "=== Extracted neoforge.mods.toml from jar ==="
          unzip -p build/libs/*.jar META-INF/neoforge.mods.toml || echo "MISSING FROM JAR!"
          # fail if modLoader missing
          if ! unzip -p build/libs/*.jar META-INF/neoforge.mods.toml | grep -q 'modLoader'; then
            echo "::error::modLoader missing in jar!"
            exit 1
          fi
          echo "✓ modLoader present"

      - name: Emit error annotations
        if: failure()
        run: |
          grep -E "error:|FAILURE: Build failed" build.log 2>/dev/null | head -50 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          if [ ! -f build.log ]; then echo "no build.log" > build.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-publish
          git add -f build.log
          git commit -m "run ${{ github.run_id }} (${{ github.sha }})" || echo "nothing to commit"
          git push --force origin ci-logs-publish:ci-logs
          # Also surface tail in the job summary as a fallback
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

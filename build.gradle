plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups('software.bernie.geckolib') }
    }
    maven {
        name = 'Sable'
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup('dev.ryanhcode.sable-companion') }
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://code.redspace.io/releases"
    }
    maven {
        url = "https://code.redspace.io/snapshots"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

java {
    withSourcesJar()
}

jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }
        clientDev2 {
            parent runs.client

            workingDirectory project.file('runDev2')
            args '--username', 'Dev2'
        }

        server {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
            property 'irons_artifice.gameTestReport', file('build/gametest-report.xml').getAbsolutePath()
        }

        data {
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
        jarJar.ranged(it, "[${mixinextras_version},)")
    }

    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation fg.deobf("io.redspace:irons_lib:${irons_lib_version}")
    // PORT-PLACEHOLDER: sable-companion has no 1.20.1 artifact; restore as jarJar + fg.deobf once one exists
//    implementation fg.deobf("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

//    implementation fg.deobf("curse.maven:create-aeronautics-676721:8763471")
//    implementation fg.deobf("curse.maven:create-328085:7963363")
//    implementation fg.deobf("curse.maven:sable-1312371:8673825")
}

var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_logo_file          : mod_logo_file,
        geckolib_version       : geckolib_version,
        irons_lib_version      : irons_lib_version,
]

processResources {
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
}
jar.finalizedBy('reobfJar')

// The jarJar output (with MixinExtras nested) is the released jar; the plain jar is kept as -slim.
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') {
    archiveClassifier = ''
    manifest.from(tasks.jar.manifest)
}

reobf {
    jarJar {}
}

tasks.jarJar.finalizedBy('reobfJarJar')

afterEvaluate {
    tasks.named('reobfJar').configure {
        dependsOn tasks.jar
        input.set(tasks.jar.archiveFile)
    }
    publishing.publications.mavenJava.artifact(tasks.jarJar.archiveFile.get().asFile) {
        builtBy tasks.reobfJarJar
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {
        register('mavenJava', MavenPublication) {
            artifactId mod_id
            from components.java
        }
    }

    repositories {
        maven {
            name = "redspace"

            if (project.version.endsWith('-SNAPSHOT')) {
                url uri("https://code.redspace.io/snapshots")
            } else {
                url uri("https://code.redspace.io/releases")
            }

            credentials {
                username = System.getenv("MAVEN_USER")
                password = System.getenv("MAVEN_PASS")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    def loader = "forge"
    def projectCurseforge = "1650193"
    def projectModrinth = "yOy4oSzi"
    def slug = "irons-artifice"
    def latestChangesContent = project.file("LATEST_CHANGES.MD").text

    displayName = "${mod_id}-${mod_version}"
    changelog = """
${latestChangesContent}
""".stripMargin().trim()
    // STABLE | BETA | ALPHA
    type = STABLE
    modLoaders.add(loader)
    file = tasks.jarJar.archiveFile

    curseforge {
        accessToken = System.getenv("CURSEFORGE_PUBLISH")
        projectId = projectCurseforge
        projectSlug = slug
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }
    modrinth {
        accessToken = System.getenv("MODRINTH_PUBLISH")
        projectId = projectModrinth
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER
        requires {
            id = "8BmcQJ2H"
            slug = "geckolib"
        }
    }

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
